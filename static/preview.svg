      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 30px; font-weight: 500; fill: #4b4d6d; }
      .cta { font-family: 'Segoe UI', Arial, sans-serif; font-size: 32px; font-weight: 600; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="120" y="110" width="960" height="410" rx="36" fill="url(#card)"/>
