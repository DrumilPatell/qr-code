<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f2f4ff" stop-opacity="0.95"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 52px; font-weight: 700; fill: #2d2f55; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: 500; fill: #4b4d6d; }
      .cta { font-family: 'Segoe UI', Arial, sans-serif; font-size: 26px; font-weight: 600; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="80" y="90" width="1040" height="450" rx="32" fill="url(#card)"/>
  <g transform="translate(140,160)">
    <rect x="0" y="0" width="220" height="220" rx="20" fill="#f7f8ff" stroke="#d8dcff" stroke-width="5"/>
    <rect x="24" y="24" width="66" height="66" rx="8" fill="#2d2f55"/>
    <rect x="130" y="24" width="66" height="66" rx="8" fill="#2d2f55"/>
    <rect x="24" y="130" width="66" height="66" rx="8" fill="#2d2f55"/>
    <rect x="102" y="102" width="94" height="94" rx="12" fill="#764ba2"/>
    <rect x="124" y="124" width="50" height="50" fill="#ffffff"/>
  </g>
  <text class="title" x="420" y="210">Free QR Code Generator</text>
  <text class="subtitle" x="420" y="260">Create &amp; download high-quality QR codes</text>
  <text class="subtitle" x="420" y="295">in seconds. No sign-up required.</text>
  <g transform="translate(420,340)">
    <rect x="0" y="0" width="520" height="60" rx="16" fill="#667eea"/>
    <text class="cta" x="20" y="40">Paste your link &amp; download your QR code</text>
  </g>
  <text class="subtitle" x="420" y="450" fill="#7a7dab">Works on any device • Instant PNG download</text>
</svg>
